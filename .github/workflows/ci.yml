# CI — the gate on every push and pull request. `release.yml` runs the same
# three commands again against the tag it packages, so nothing here replaces
# that; this is what says so before a merge rather than after one.

name: CI

# Every branch, not just `main`: the work happens on branches here, and a gate
# that only speaks on the default branch has nothing to say until after the
# thing it was meant to catch has landed. A branch that also has a pull request
# open runs twice, which on a public repository costs nothing and is the
# cheaper mistake than not running at all.
on:
    push:
    pull_request:

# A second push to a branch supersedes the run still in flight on it. Not on
# `main`: cancelling there can leave a merged commit with no completed run
# against it, which is the one place the answer is worth waiting for.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # The device target, for the cross build below. The host toolchain
            # is whatever the runner ships.
            - name: Install the cross target
              run: rustup target add armv7-unknown-linux-musleabihf

            # Not `actions/cache` over `target/`: that directory runs to
            # gigabytes here — a debug tree, a release tree and a cross tree —
            # against a 10 GB cap for the whole repository, and a key of the
            # lockfile alone is written once and then never refreshed, since
            # `actions/cache` only saves on a miss. This keys on the compiler
            # as well as the lockfile, keeps the dependency artifacts rather
            # than the whole tree, and prunes what a build stopped using.
            - uses: Swatinem/rust-cache@v2
              with:
                  key: armv7

            # `catalog`'s tests build their fixtures with the `sqlite3` binary,
            # which ubuntu-latest ships.
            - name: Format, lint, test
              run: |
                  cargo fmt --all --check
                  cargo clippy --workspace --all-targets -- -D warnings
                  cargo test --workspace

            # The host tests say nothing about the link this actually ships:
            # `rust-lld` and the musl crt objects, per .cargo/config.toml.
            - name: Build for the device
              run: cargo build --release --target armv7-unknown-linux-musleabihf
